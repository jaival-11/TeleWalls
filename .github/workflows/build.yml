name: Build TeleWalls APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Set up Debug Keystore
      env:
        DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
          echo "Restoring debug keystore from secret..."
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > app/debug.keystore
        else
          echo "DEBUG_KEYSTORE_BASE64 secret not set, generating fallback keystore..."
          keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Run Unit Tests
      run: ./gradlew test --no-daemon

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Prepare APK Artifacts
      run: |
        mkdir -p apks/arm64-v8a apks/armeabi-v7a apks/x86 apks/x86_64 apks/universal
        find app/build/outputs/apk -name "*arm64-v8a*.apk" -exec cp {} apks/arm64-v8a/TeleWalls-arm64-v8a.apk \;
        find app/build/outputs/apk -name "*arm64-v8a*.apk" -exec cp {} apks/arm64-v8a/TeleWalls-arm64-v8.apk \;
        find app/build/outputs/apk -name "*armeabi-v7a*.apk" -exec cp {} apks/armeabi-v7a/TeleWalls-armeabi-v7a.apk \;
        find app/build/outputs/apk -name "*x86_64*.apk" -exec cp {} apks/x86_64/TeleWalls-x86_64.apk \;
        find app/build/outputs/apk -name "*x86*.apk" ! -name "*x86_64*.apk" -exec cp {} apks/x86/TeleWalls-x86.apk \;
        find app/build/outputs/apk -name "*universal*.apk" -exec cp {} apks/universal/TeleWalls-universal.apk \;

    - name: Upload arm64-v8a APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TeleWalls-arm64-v8a
        path: apks/arm64-v8a/

    - name: Upload armeabi-v7a APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TeleWalls-armeabi-v7a
        path: apks/armeabi-v7a/

    - name: Upload x86 APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TeleWalls-x86
        path: apks/x86/

    - name: Upload x86_64 APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TeleWalls-x86_64
        path: apks/x86_64/

    - name: Upload Universal APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TeleWalls-universal
        path: apks/universal/
