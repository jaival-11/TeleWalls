name: Release TeleWalls APK

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Set up Release Keystore
      env:
        RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
          echo "Restoring release keystore from secret..."
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release.keystore
        elif [ -f "release.keystore" ]; then
          echo "Using release.keystore present in repository root..."
          cp release.keystore app/release.keystore
        else
          echo "WARNING: release.keystore not found and RELEASE_KEYSTORE_BASE64 secret is not set."
        fi

    - name: Run Unit Tests
      run: ./gradlew test --no-daemon

    - name: Build Release APKs
      env:
        RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || secrets.KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease --no-daemon

    - name: Prepare Release APK Artifacts
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        mkdir -p release-apks
        find app/build/outputs/apk/release -name "*arm64-v8a*.apk" -exec cp {} release-apks/TeleWalls-${VERSION}-arm64-v8a.apk \;
        find app/build/outputs/apk/release -name "*armeabi-v7a*.apk" -exec cp {} release-apks/TeleWalls-${VERSION}-armeabi-v7a.apk \;
        find app/build/outputs/apk/release -name "*x86_64*.apk" -exec cp {} release-apks/TeleWalls-${VERSION}-x86_64.apk \;
        find app/build/outputs/apk/release -name "*x86*.apk" ! -name "*x86_64*.apk" -exec cp {} release-apks/TeleWalls-${VERSION}-x86.apk \;
        find app/build/outputs/apk/release -name "*universal*.apk" -exec cp {} release-apks/TeleWalls-${VERSION}-universal.apk \;

    - name: Generate Release Notes
      run: |
        TAG_NAME="${GITHUB_REF_NAME}"
        PREV_TAG=$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || true)

        echo "# ${TAG_NAME}" > release_notes.md
        echo "" >> release_notes.md
        echo "## \`Changelog:\`" >> release_notes.md
        echo "" >> release_notes.md

        REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"

        if [ -n "$PREV_TAG" ]; then
          git log "${PREV_TAG}..${TAG_NAME}" --reverse --pretty=format:"- %s ([%h](${REPO_URL}/commit/%H))" >> release_notes.md
        else
          git log "${TAG_NAME}" --reverse --pretty=format:"- %s ([%h](${REPO_URL}/commit/%H))" >> release_notes.md
        fi
        echo "" >> release_notes.md

        echo "Generated Release Notes:"
        cat release_notes.md

    - name: Draft GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        draft: true
        name: ${{ github.ref_name }}
        tag_name: ${{ github.ref_name }}
        body_path: release_notes.md
        files: |
          release-apks/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
